<!-- Real athlete poster card (9:16), typography only. Data attrs fill the template. -->
<template id="real-poster"><article class="rp" style="aspect-ratio:9/16;background:#111;color:#fff;border-top:4px solid #d43f21;padding:24px;display:flex;flex-direction:column;justify-content:flex-end;position:relative;overflow:hidden">
<span style="position:absolute;top:24px;left:24px;font:700 12px/1 'Barlow Condensed';letter-spacing:.14em;text-transform:uppercase" data-f="sport_state"></span>
<span style="position:absolute;right:-10px;top:10%;font:400 260px/1 Anton;color:#222" data-f="num"></span>
<h3 style="font:400 clamp(40px,9vw,76px)/.9 Anton;text-transform:uppercase;margin:0" data-f="name"></h3>
<p style="font:400 16px 'Inter Tight';color:#bbb" data-f="path"></p><b style="background:#fff;color:#111;font:700 14px 'Barlow Condensed';padding:6px 12px;width:max-content" data-f="div"></b>
<small style="font:500 11px 'JetBrains Mono';color:#888;margin-top:14px" data-f="source"></small></article></template>
