<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Story · The Recruiting Calendar</title><link rel="stylesheet" href="ring.css"><style>
body{background:#fff}
.beat{position:relative;height:var(--len,250vh)}
.pin{position:sticky;top:0;height:100svh;overflow:hidden;display:grid;place-items:center;perspective:1200px}
.kicker{font:600 11px/1 Arial;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.big{font:900 clamp(48px,11vw,170px)/.86 "Arial Narrow","Helvetica Neue",Arial,sans-serif;text-transform:uppercase;letter-spacing:-.03em;margin:0;text-align:center}
.b1 .big{transform:translateY(calc((1 - var(--p,0))*30px)) scale(calc(1 + var(--p,0)*.25));opacity:calc(1 - var(--p,0)*1.2)}
.b1 .lede{position:absolute;bottom:12vh;left:0;right:0;text-align:center;opacity:calc(var(--p,0)*2 - .4);transform:translateY(calc((1 - var(--p,0))*40px))}
.stage3d{transform-style:preserve-3d;transform:rotateY(calc(var(--p,0)*-70deg + 35deg)) rotateX(calc(8deg - var(--p,0)*8deg)) translateZ(calc(var(--p,0)*120px));width:min(320px,60vw);aspect-ratio:.5625;position:relative}
.plate{position:absolute;inset:0;background:#111;color:#fff;display:flex;align-items:flex-end;padding:20px;font:900 28px/.9 "Arial Narrow",Arial;text-transform:uppercase;backface-visibility:hidden}
.plate.rear{transform:translateZ(-80px) scale(1.2);background:#e5e5e5;color:#111}
.plate.front{transform:translateZ(60px);background:transparent;color:#111;mix-blend-mode:multiply;font-size:clamp(40px,7vw,90px)}
.side{position:absolute;left:6vw;top:50%;transform:translateY(-50%);max-width:30ch;font-size:15px;line-height:1.5;opacity:calc(var(--p,0)*3 - .5)}
.timeline{position:absolute;left:8vw;right:8vw;top:50%;height:2px;background:rgb(17 17 17/.14)}
.timeline::after{content:"";position:absolute;inset:0;background:#111;transform:scaleX(var(--p,0));transform-origin:left}
.ev{position:absolute;top:-8px;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:#fff;border:2px solid #111;transition:background .4s,transform .6s var(--ease)}
.ev.on{background:#111;transform:scale(1.25)}
.evlabel{position:absolute;top:28px;left:50%;transform:translateX(-50%);width:140px;text-align:center;font-size:12px;opacity:.35;transition:opacity .5s}
.ev.on .evlabel{opacity:1}
.evdate{font:900 18px "Arial Narrow",Arial;display:block}
.vid{width:min(1100px,92vw);aspect-ratio:16/9;background:#111;color:#fff;display:grid;place-items:center;clip-path:inset(calc((1 - min(var(--p,0)*2,1))*30%) round 0);transform:scale(calc(.8 + min(var(--p,0)*2,1)*.2))}
.vid video{width:100%;height:100%;object-fit:cover}
.chip{position:absolute;top:16px;left:16px;font:600 10px Arial;letter-spacing:.14em;background:#fff;color:#111;padding:5px 8px;text-transform:uppercase}
.end{min-height:100svh;display:grid;place-items:center;padding:60px 20px;border-top:1px solid var(--line)}
.end-in{max-width:900px;width:100%}.end ul{list-style:none;padding:0;margin:24px 0}
.end li{display:flex;justify-content:space-between;align-items:center;padding:18px 0;border-top:1px solid var(--line);font-size:16px}
.reveal{opacity:0;transform:translateY(30px);filter:blur(6px);transition:opacity 1s var(--ease),transform 1.2s var(--ease),filter 1s var(--ease)}.reveal.in{opacity:1;transform:none;filter:none}
.progress{position:fixed;left:0;top:0;height:3px;background:#111;width:100%;transform:scaleX(var(--sp,0));transform-origin:left;z-index:60}
.back{position:fixed;top:14px;left:20px;z-index:61;font:600 12px Arial;background:#fff;padding:8px 12px;border:1px solid #111}
@media (prefers-reduced-motion:reduce){.beat{height:auto}.pin{position:relative;height:auto;min-height:80svh;padding:60px 0}
 .b1 .big,.b1 .lede,.side,.stage3d,.vid{transform:none!important;opacity:1!important;clip-path:none!important}.timeline::after{transform:none}.reveal{opacity:1;transform:none;filter:none}}
@media (max-width:749px){.evlabel{width:70px;font-size:10px}.ev:not(.on) .evlabel{opacity:0}.ev:nth-child(odd) .evlabel{top:-64px}.evdate{font-size:13px}}</style></head><body>
<div class="progress"></div><a class="back" href="index.html">← All stories</a>
<main id="story"></main><div id="bag-status" role="status" aria-live="polite"></div>
<script src="data.js"></script><script>
(()=>{const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;const D=STORY_DATA;
const id=new URLSearchParams(location.search).get('a')||'a1';const a=D.athletes.find(x=>x.id===id)||D.athletes[0];
const evs=[['Fresh.','Starts a training log'],['Soph.','Sends first coach emails'],['Junior','Film + camps'],['Summer','Visits'],['Senior','Commits: '+a.div]];
const bag=new Set(JSON.parse(localStorage.getItem('playbook-bag-v1')||'[]'));
document.getElementById('story').innerHTML=`
<section class="beat b1" style="--len:200vh"><div class="pin"><div><p class="kicker" style="text-align:center">${a.sport} · ${a.div} · Composite placeholder</p><h1 class="big">${a.school.split(',')[0]}<br>to ${a.college}</h1></div><p class="lede kicker">Scroll ↓ Composite story built from sourced recruiting paths (sources pending W3)</p></div></section>
<section class="beat b2" style="--len:260vh"><div class="pin"><p class="side">Beat 2 · Scroll-linked 3D. The card turns as you scroll; layers sit at different depths. Imagery slot: Illustration (W2).</p><div class="stage3d"><div class="plate rear">Illustration slot</div><div class="plate">${a.sport}</div><div class="plate front">${a.div}</div></div></div></section>
<section class="beat b3" style="--len:300vh"><div class="pin"><p class="kicker" style="position:absolute;top:14vh">Beat 3 · Timeline scrub</p><div class="timeline">${evs.map((e,i)=>`<span class="ev" style="left:${i/(evs.length-1)*100}%"><span class="evlabel"><span class="evdate">${e[0]}</span>${e[1]}</span></span>`).join('')}</div></div></section>
<section class="beat b4" style="--len:220vh"><div class="pin"><div class="vid"><span class="chip">Video slot · Illustration</span><span class="kicker" style="color:#aaa">Drop an MP4 into data-video (W2)</span></div></div></section>
<section class="end"><div class="end-in reveal"><p class="kicker">The playbooks in this story</p><h2 class="big" style="text-align:left;font-size:clamp(40px,7vw,96px)">Run the same plays.</h2>
<ul>${a.playbooks.map(p=>`<li><span>${D.playbooks[p].title}</span><button class="sr__add" data-add="${p}" aria-pressed="${bag.has(p)}">${bag.has(p)?'Added':'Add'}</button></li>`).join('')}</ul>
<button class="sr__cta" style="width:100%">Get these playbooks (test mode)</button></div></section>`;
const beats=[...document.querySelectorAll('.beat')],evEls=[...document.querySelectorAll('.ev')],root=document.documentElement;let ticking=false;
function upd(){ticking=false;const vh=innerHeight;(window.__ft=window.__ft||[]).push(performance.now());
 root.style.setProperty('--sp',(scrollY/(root.scrollHeight-vh)).toFixed(4));
 for(const b of beats){const r=b.getBoundingClientRect(),len=r.height-vh;const p=Math.max(0,Math.min(1,-r.top/Math.max(1,len)));b.style.setProperty('--p',p.toFixed(4));
  if(b.classList.contains('b3'))evEls.forEach((e,i)=>e.classList.toggle('on',p>=i/(evEls.length-1)-.02))}}
addEventListener('scroll',()=>{if(!ticking){ticking=true;requestAnimationFrame(upd)}},{passive:true});addEventListener('resize',upd);upd();
if(RM)evEls.forEach(e=>e.classList.add('on'));
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)e.target.classList.add('in')}),{threshold:.2});document.querySelectorAll('.reveal').forEach(e=>io.observe(e));
document.addEventListener('click',e=>{const b=e.target.closest('[data-add]');if(!b)return;const p=b.dataset.add;bag.has(p)?bag.delete(p):bag.add(p);const on=bag.has(p);b.setAttribute('aria-pressed',on);b.textContent=on?'Added':'Add';localStorage.setItem('playbook-bag-v1',JSON.stringify([...bag]));const t=document.getElementById('bag-status');t.textContent=on?'Playbook saved to your bag':'Removed';t.classList.add('is-on');setTimeout(()=>t.classList.remove('is-on'),2500)});
})();
</script></body></html>
